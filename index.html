<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for professional typography -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Personal Expense Tracker</h1>
            <p class="subtitle">Manage your financial portfolio seamlessly</p>
        </header>

        <!-- Dashboard Dashboard Metrics -->
        <section class="dashboard-card" aria-label="Financial Summary">
            <div class="balance-container">
                <h2>Your Balance</h2>
                <h3 id="total-balance" class="balance-amount">$0.00</h3>
            </div>
            
            <div class="summary-breakdown">
                <div class="summary-box income">
                    <span>Total Income</span>
                    <p id="summary-income">+$0.00</p>
                </div>
                <div class="summary-box expense">
                    <span>Total Expenses</span>
                    <p id="summary-expense">-$0.00</p>
                </div>
            </div>
        </section>

        <!-- Main Workspace Split Layout -->
        <main class="main-content">
            <!-- Transaction Form Module -->
            <section class="form-section" aria-labelledby="form-title">
                <h4 id="form-title">Add New Transaction</h4>
                <form id="transaction-form" novalidate>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" placeholder="e.g., Freelance, Groceries" required maxlength="50">
                        <span class="error-msg" id="desc-error">Please enter a valid description.</span>
                    </div>

                    <div class="form-group">
                        <label for="amount">Amount ($)</label>
                        <input type="number" id="amount" placeholder="0.00" step="0.01" min="0.01" required>
                        <span class="error-msg" id="amount-error">Please enter an amount greater than 0.</span>
                    </div>

                    <div class="form-group">
                        <label for="type">Transaction Type</label>
                        <select id="type" required>
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-submit">Add Transaction</button>
                </form>
            </section>

            <!-- Ledger/History Module -->
            <section class="history-section" aria-labelledby="history-title">
                <div class="history-header">
                    <h4 id="history-title">Transaction History</h4>
                    <div class="filter-controls">
                        <button class="filter-btn active" data-filter="all">All</button>
                        <button class="filter-btn" data-filter="income">Income</button>
                        <button class="filter-btn" data-filter="expense">Expense</button>
                    </div>
                </div>
                <ul id="transaction-list" class="transaction-list">
                    <!-- Dynamic Items Injected via JavaScript -->
                </ul>
                <div id="empty-state" class="empty-state">
                    <p>No transactions logged yet.</p>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
